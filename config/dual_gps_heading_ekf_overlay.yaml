# Overlay para dual GPS heading. Se carga ENCIMA de dual_ekf_navsat_params.yaml
# cuando use_dual_gps_heading:=true.
#
# Modifica:
#   - ekf_filter_node_odom: desactiva yaw absoluto de imu0 y agrega
#     imu1 (/dual_gps/heading) como fuente de yaw absoluto.
#   - navsat_transform: usa el yaw de /odometry/local para que la
#     odometría GPS y el EKF local compartan la misma orientación.
#
# ekf_filter_node_map NO se toca: ya tenía imu0 yaw=false en el yaml base
# y recibe las correcciones de posición vía /odometry/gps.

ekf_filter_node_odom:
  ros__parameters:
    # imu0 (/imu/data): conservar roll/pitch y yaw_rate del Pixhawk,
    # pero desactivar yaw absoluto (lo proveerá el dual GPS).
    imu0_config: [false, false, false,
                  true,  true,  false,
                  false, false, false,
                  false, false, true,
                  false, false, false]

    # imu1: heading absoluto del dual GPS (solo yaw).
    imu1: /dual_gps/heading
    imu1_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    imu1_differential: false
    imu1_relative: false

navsat_transform:
  ros__parameters:
    use_odometry_yaw: true
