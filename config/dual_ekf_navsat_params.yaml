ekf_filter_node_odom:
  ros__parameters:
    frequency: 50.0
    two_d_mode: true
    print_diagnostics: true
    publish_tf: true
    dynamic_process_noise_covariance: true
    alpha: 0.001
    beta: 2.0
    kappa: 0.0

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: /wheel/odometry
    # odom0_config: [false, false, false,
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    
    odom1: /odom
    # odom1_config: [false, false, false,
    odom1_config: [true, true, false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: false
    odom1_relative: false

    # odom1: /odometry/pixhawk
    # odom1_config: [true, true, false,
    #                false, false, false,
    #                false, false, false,
    #                false, false, false,
    #                false, false, false]
    # odom1_differential: false
    # odom1_relative: false

    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  # false, false, true,
                  false, false, false,
                  false, false, true,
                  # true, true, true]
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true

ekf_filter_node_map:
  ros__parameters:
    frequency: 50.0
    two_d_mode: true
    print_diagnostics: true
    publish_tf: true
    dynamic_process_noise_covariance: true
    alpha: 0.001
    beta: 2.0
    kappa: 0.0

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: map

    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  # true, true, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
                  # true, true, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true

    odom0: /odometry/local
    odom0_config: [false, false, false,
                   false, false, true,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false

    odom1: /odometry/gps
    odom1_config: [true, true, false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: false
    odom1_relative: false

navsat_transform:
  ros__parameters:
    frequency: 30.0
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    # yaw_offset: 1.57
    zero_altitude: true
    broadcast_utm_transform: false
    publish_filtered_gps: true
    use_odometry_yaw: false
    # use_odometry_yaw: true
    wait_for_datum: true

    gps_topic: /gps/fix
    odom_topic: /odometry/local
    output_topic: /odometry/gps
