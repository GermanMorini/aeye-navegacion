ekf_filter_node_map:
  ros__parameters:
    # In simulation, anchor map with Gazebo ground-truth odom like sim-german.
    # This avoids the map->odom lateral drift that makes the robot appear
    # parallel to the global plan even when local tracking is acceptable.
    dynamic_process_noise_covariance: false
    odom0: /wheel/odometry
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_relative: false
    odom1: /odom
    odom1_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false]
    odom1_relative: false

navsat_transform:
  ros__parameters:
    odom_topic: /odom
